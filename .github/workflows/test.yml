name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test including native machine identity
        env:
          LICENSEBOX_TEST_NATIVE: '1'
        run: go test -race ./... -count=1 -timeout=5m
      - run: go vet ./...

  conformance:
    uses: licensebox/protocol/.github/workflows/sdk.yml@f210048228da2fcb2b11618d52b481a8e8f2f79e
    with:
      language: go
